    <!-- Botones ubicados a la izquierda, inmediatamente después del fondo del logo -->
    <div class="flex items-center px-3">
      <button id="btnHeaderUndo" class="cad-button cad-button-square h-8 w-8" title="Deshacer (Ctrl+Z)">
        <span class="iconify text-xl" data-icon="carbon:undo"></span>
      </button>

      <button id="btnHeaderRedo" class="cad-button cad-button-square h-8 w-8" title="Rehacer (Ctrl+Y)">
        <span class="iconify text-xl" data-icon="carbon:redo"></span>
      </button>

      <div class="flat-divider h-4 mx-1"></div>

      <button id="btnHeaderExportSVG" class="cad-button cad-button-square h-8 w-8 flex items-center text-xs " title="Exportar Dibujo a SVG">
        <span class="iconify text-lg" data-icon="carbon:cloud-download"></span>
      </button>
    </div>

  </header>

  <!-- CONTENEDOR PRINCIPAL DEL ÁREA DE TRABAJO -->
  <div class="flex-1 flex min-h-0 relative w-full overflow-hidden">

    <!-- Contenedor de acople izquierdo principal -->
    <div id="leftDockContainer" class="h-full flex shrink-0"></div>

    <!-- Viewport Principal del Canvas -->
    <div id="mainViewport" class="relative flex-1 h-full flex flex-col min-w-0">
      <canvas id="cadCanvas" class="tool-draw" tabindex="0" resize></canvas>

      <!-- Contenedor donde se inyecta la UI dinámicamente -->
      <div id="app-ui-container"></div>
    </div>

    <!-- Contenedor de acople a la izquierda del panel de control -->
    <div id="panelLeftDockContainer" class="h-full flex shrink-0"></div>

    <!-- Resizer Lateral del Panel de Control -->
    <div id="resizer" class="group relative w-[1px] cursor-col-resize shrink-0 h-full z-30">
      <!-- Hitbox invisible para agarre fácil (8px de tolerancia) -->
      <div class="absolute -left-1 -right-1 top-0 bottom-0"></div>
      
      <!-- Línea visual flotante centrada (controlada 100% por CSS) -->
      <div id="resizerVisualLine" class="absolute inset-y-0 left-1/2 -translate-x-1/2 pointer-events-none transition-all duration-150"></div>
    </div>

    <!-- Sidebar Derecho de Control -->
    <aside id="rightSidebar" class="w-72 h-full bg-[#1e1e24] flex flex-col z-20 relative transition-all duration-150 overflow-hidden shrink-0">
      <div id="sidebarHeader" class="p-1 bg-[#17171c] flex items-center justify-between min-h-[40px] shrink-0">
        <div id="sidebarTitleGroup" class="flex items-center gap-2 pl-2">
          <i class="fa-solid fa-gear text-zinc-200 text-xs"></i>
          <span class="text-xs font-semibold text-zinc-200 tracking-wide whitespace-nowrap">PANEL DE CONTROL</span>
        </div>
        <button id="btnToggleSidebar" class="cad-button cad-button-square h-8 w-8 hover:bg-[#2a2a32] text-zinc-400 hover:text-white shrink-0" title="Colapsar / Expandir">
          <i id="sidebarIcon" class="fa-solid fa-chevron-right text-xs"></i>
        </button>
      </div>

      <div id="sidebarContent" class="flex-1 flex flex-col overflow-hidden min-h-0">
        <!-- Panel de Propiedades -->
        <div id="propertyPanelContainer" class="p-3.5 flex flex-col gap-3 shrink-0 overflow-hidden" style="height: 50%; min-height: 90px;"></div>

        <!-- Divisor Vertical Arrastrable (1px pixel-perfect con margen lateral) -->
        <div id="sidebarVerticalResizer" class="group relative h-[1px] bg-[#2a2a32] cursor-row-resize shrink-0 z-30 mx-3.5 my-1">
          <!-- Hitbox invisible de 9px (expande 4px arriba/abajo y a los bordes para agarre fácil) -->
          <div class="absolute -top-1 -bottom-1 -left-3.5 -right-3.5"></div>
          
          <!-- Indicador visual: 1px exacto en reposo; se expande simétricamente a 3px verde sin desplazar el layout -->
          <div class="absolute inset-x-0 top-1/2 -translate-y-1/2 h-[1px] bg-[#2a2a32] group-hover:bg-[#008800] group-hover:h-[3px] group-[.is-dragging]:bg-[#008800] group-[.is-dragging]:h-[3px] transition-all duration-150 pointer-events-none"></div>
        </div>

        <!-- Capas (Layers) -->
        <div id="layerPanelContainer" class="p-3.5 flex flex-col gap-3 flex-1 min-h-[90px] overflow-hidden">
          <!-- LayerPanelUI.js renderizará la UI aquí adentro -->
        </div>
      </div>
    </aside>

    <!-- Contenedor de acople extremo derecho -->
    <div id="rightDockContainer" class="h-full flex shrink-0"></div>

  </div>

  <script src="icons/icons.js"></script>
  <script type="module">
    import { CADToolbarComponent } from './ui/toolbarComponent.js';
    import { CADService } from './services/cadService.js';
    import { CADUtils } from './cadUtils.js';
    import { CADIOService } from './services/ioService.js';
    import { CADUIManager } from './ui/uiManager.js';
    import { LayerPanelUI } from './ui/LayerPanelUI.js';
    import { PropertyPanelUI } from './ui/PropertyPanelUI.js';
    
    window.addEventListener('load', () => {
      // 1. Inyectar Componente de Interfaz
      const toolbar = new CADToolbarComponent('app-ui-container');
      toolbar.render();

      // Forzar renderizado de Iconify sobre los elementos inyectados dinámicamente
      if (window.Iconify) {
        window.Iconify.scan(document.getElementById('app-ui-container'));
      }

      // 2. Inicializar Servicios y UI Manager
      window.cadService = new CADService();
      window.cadUtils = new CADUtils('cadCanvas', window.cadService);
      window.cadIO = new CADIOService();

      // 3. Inicializar Paper.js PRIMERO para tener contexto de lienzo
      window.cadUtils.initPaper();
      
      // 4. Inicializar Administradores de UI (después de Paper.js)
      window.cadUI = new CADUIManager(window.cadUtils, window.cadService);
      window.layerPanelUI = new LayerPanelUI(window.cadUtils, 'layerPanelContainer');
      window.propertyPanelUI = new PropertyPanelUI(window.cadUtils, 'propertyPanelContainer');

      // 5. Cargar entidades y refrescar la lista de capas visuales
      window.cadUI.init();
      window.cadService.createDemoEntities();
      window.layerPanelUI.refresh();
      window.propertyPanelUI.refresh();

      window.cadUtils.renderBezierHandles();
      window.cadUtils.setTool('select');
    });
  </script>
