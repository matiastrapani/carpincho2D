<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Carpincho 2D - CAD Canvas</title>

  <!-- Librerías de Estilos e Iconos -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/paper.js/0.12.17/paper-full.min.js"></script>

  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/ui-controls.css" />
  <script src="https://code.iconify.design/3/3.1.1/iconify.min.js"></script>
  
  <link rel="icon" href="assets/favicon.ico" sizes="any">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="carpincho2D" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<script src="https://unpkg.com/ios-pwa-splash@1.0.0/cdn.min.js"></script>
<script>iosPWASplash('assets/apple-touch-icon.png', '#888888');</script>
  <meta name="theme-color" content="#888888">
</head>

<body class="text-zinc-400 flex flex-col h-screen w-screen overflow-hidden font-sans bg-[#121215] select-none">

  <!-- CABEZAL FIJO SUPERIOR -->
  <header id="appTopHeader" class="h-[40px] min-h-[40px] bg-[#17171c] border-b-[3px] border-[#121215] flex items-center justify-start z-50 shrink-0 select-none">
    
    <!-- Bloque del Logo: -->
    <div class="w-[180px] h-[37px] min-w-[180px] bg-[#1e1e24] flex items-center justify-center shrink-0 px-2 overflow-hidden">
      <!-- Contenedor del SVG (sin deformar) -->
      <img src="assets/carpincho2D.svg" alt="Carpincho 2D" class="w-[155px] h-auto block" />
    </div>


    <!-- Botones ubicados a la izquierda, inmediatamente después del fondo del logo -->
    <div class="flex items-center px-3">
      <button id="btnHeaderUndo" class="cad-button cad-button-square h-8 w-8" title="Deshacer (Ctrl+Z)">
        <span class="iconify text-xl" data-icon="carbon:undo"></span>
      </button>

      <button id="btnHeaderRedo" class="cad-button cad-button-square h-8 w-8" title="Rehacer (Ctrl+Y)">
        <span class="iconify text-xl" data-icon="carbon:redo"></span>
      </button>

      <div class="flat-divider h-4 mx-1"></div>

      <button id="btnHeaderExportSVG" class="cad-button cad-button-square h-8 w-8 flex items-center text-xs " title="Exportar Dibujo a SVG">
        <span class="iconify text-lg" data-icon="carbon:cloud-download"></span>
      </button>
    </div>

  </header>

  <!-- CONTENEDOR PRINCIPAL DEL ÁREA DE TRABAJO -->
  <div class="flex-1 flex min-h-0 relative w-full overflow-hidden">

    <!-- Contenedor de acople izquierdo principal -->
    <div id="leftDockContainer" class="h-full flex shrink-0"></div>

    <!-- Columna del espacio de trabajo (Canvas + Consola Fija) -->
    <div id="workspaceContainer" class="flex-1 h-full flex flex-col min-w-0">
      
      <!-- Viewport Principal del Canvas -->
      <div id="mainViewport" class="relative flex-1 min-h-0 w-full overflow-hidden">
        <canvas id="cadCanvas" class="tool-draw" tabindex="0"></canvas>

        <!-- Contenedor donde se inyecta la UI dinámicamente -->
        <div id="app-ui-container"></div>
      </div>

      <!-- Contenedor reservado para la Consola Fija -->
      <div id="fixedConsoleContainer" class="shrink-0 w-full min-h-0 z-40"></div>

    </div>

    <!-- Contenedor de acople a la izquierda del panel de control -->
    <div id="panelLeftDockContainer" class="h-full flex shrink-0"></div>

    <!-- Resizer Lateral del Panel de Control -->
    <div id="resizer" class="group relative w-[1px] cursor-col-resize shrink-0 h-full z-50">
      <!-- Hitbox invisible para agarre fácil (8px de tolerancia) -->
      <div class="absolute -left-1 -right-1 top-0 bottom-0"></div>
      
      <!-- Línea visual flotante centrada (controlada 100% por CSS) -->
      <div id="resizerVisualLine" class="absolute inset-y-0 left-1/2 -translate-x-1/2 pointer-events-none transition-all duration-150"></div>
    </div>

    <!-- Botón flotante minimalista sin fondo para desplegar cuando el panel está colapsado -->
    <button id="btnExpandSidebar" type="button" class="hidden absolute top-1.5 right-1.5 z-50 h-7 w-7 flex items-center justify-center bg-transparent text-zinc-400 hover:text-white cursor-pointer tooltip-bottom-right" data-tooltip="Expandir Panel">
      <i class="fa-solid fa-chevron-left text-xs"></i>
    </button>

    <!-- Sidebar Derecho de Control -->
    <aside id="rightSidebar" class="w-72 min-w-0 h-full bg-[#1e1e24] flex flex-col z-20 relative transition-[width] duration-[180ms] ease-out shrink-0">
      <div id="sidebarHeader" class="p-1 bg-[#17171c] flex items-center justify-between min-h-[40px] shrink-0">
        <div id="sidebarTitleGroup" class="flex items-center gap-2 pl-2 overflow-hidden">
          <i class="fa-solid fa-gear text-zinc-200 text-xs shrink-0"></i>
          <span class="text-xs font-semibold text-zinc-200 tracking-wide whitespace-nowrap">PANEL DE CONTROL</span>
        </div>
        <button id="btnToggleSidebar" type="button" class="cad-button cad-button-square h-8 w-8 hover:bg-[#2a2a32] text-zinc-400 hover:text-white shrink-0 tooltip-bottom-right" data-tooltip="Colapsar Panel">
          <i id="sidebarIcon" class="fa-solid fa-chevron-right text-xs"></i>
        </button>
      </div>

      <div id="sidebarContent" class="flex-1 flex flex-col min-h-0">
        <!-- Panel de Propiedades -->
        <div id="propertyPanelContainer" class="p-3.5 flex flex-col gap-3 shrink-0" style="height: 50%; min-height: 90px;"></div>

        <!-- Divisor Vertical Arrastrable (1px pixel-perfect con margen lateral) -->
        <div id="sidebarVerticalResizer" class="group relative h-[1px] bg-[#2a2a32] cursor-row-resize shrink-0 z-30 mx-3.5 my-1">
          <!-- Hitbox invisible de 9px (expande 4px arriba/abajo y a los bordes para agarre fácil) -->
          <div class="absolute -top-1 -bottom-1 -left-3.5 -right-3.5"></div>
          
          <!-- Indicador visual: 1px exacto en reposo; se expande simétricamente a 3px verde sin desplazar el layout -->
          <div class="absolute inset-x-0 top-1/2 -translate-y-1/2 h-[1px] bg-[#2a2a32] group-hover:bg-[#008800] group-hover:h-[3px] group-[.is-dragging]:bg-[#008800] group-[.is-dragging]:h-[3px] transition-all duration-150 pointer-events-none"></div>
        </div>

        <!-- Capas (Layers) -->
        <div id="layerPanelContainer" class="p-3.5 flex flex-col gap-3 flex-1 min-h-[90px]">
          <!-- LayerPanelUI.js renderizará la UI aquí adentro -->
        </div>
      </div>
    </aside>

    <!-- Contenedor de acople extremo derecho -->
    <div id="rightDockContainer" class="h-full flex shrink-0"></div>

  </div>

  <script src="icons/icons.js" defer></script>
  <script type="module" src="app.js"></script>
</body>
</html>
